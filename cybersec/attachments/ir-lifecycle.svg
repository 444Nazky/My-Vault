<svg width="640" height="360" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b3d2e"/><stop offset="1" stop-color="#1a1a2e"/></linearGradient></defs>
<rect width="640" height="360" fill="url(#bg)"/>
<text x="320" y="38" text-anchor="middle" fill="#4ecca3" font-size="22" font-weight="bold">Incident Response Lifecycle</text>
<rect x="20" y="70" width="120" height="70" rx="12" fill="#4ecca3"/>
<text x="80" y="97" text-anchor="middle" fill="#1a1a2e" font-size="12" font-weight="bold">P</text>
<text x="80" y="118" text-anchor="middle" fill="#1a1a2e" font-size="11">Preparation</text>
<line x1="140" y1="105" x2="155" y2="105" stroke="#fff" stroke-width="2"/>
<rect x="150" y="70" width="120" height="70" rx="12" fill="#f9ca24"/>
<text x="210" y="97" text-anchor="middle" fill="#1a1a2e" font-size="12" font-weight="bold">I</text>
<text x="210" y="118" text-anchor="middle" fill="#1a1a2e" font-size="11">Identification</text>
<line x1="270" y1="105" x2="285" y2="105" stroke="#fff" stroke-width="2"/>
<rect x="280" y="70" width="120" height="70" rx="12" fill="#ffb347"/>
<text x="340" y="97" text-anchor="middle" fill="#1a1a2e" font-size="12" font-weight="bold">C</text>
<text x="340" y="118" text-anchor="middle" fill="#1a1a2e" font-size="11">Containment</text>
<line x1="400" y1="105" x2="415" y2="105" stroke="#fff" stroke-width="2"/>
<rect x="410" y="70" width="120" height="70" rx="12" fill="#e07be0"/>
<text x="470" y="97" text-anchor="middle" fill="#1a1a2e" font-size="12" font-weight="bold">E</text>
<text x="470" y="118" text-anchor="middle" fill="#1a1a2e" font-size="11">Eradication</text>
<line x1="530" y1="105" x2="545" y2="105" stroke="#fff" stroke-width="2"/>
<rect x="540" y="70" width="120" height="70" rx="12" fill="#4ecca3"/>
<text x="600" y="97" text-anchor="middle" fill="#1a1a2e" font-size="12" font-weight="bold">R</text>
<text x="600" y="118" text-anchor="middle" fill="#1a1a2e" font-size="11">Recovery</text>
<rect x="140" y="170" width="360" height="45" rx="12" fill="#e94560"/>
<text x="320" y="199" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Lessons Learned</text>
<rect x="20" y="235" width="600" height="100" rx="12" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
<text x="40" y="265" fill="#ccc" font-size="12">Document everything: timestamps, actions, evidence</text>
<text x="40" y="290" fill="#ccc" font-size="12">Communicate: stakeholders, legal, PR</text>
<text x="40" y="315" fill="#ccc" font-size="12">Forensics: chain of custody, images</text>
</svg>