<svg width="700" height="300" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2e5c5c"/><stop offset="1" stop-color="#1a1a2e"/></linearGradient></defs>
<rect width="700" height="300" fill="url(#bg)"/>
<text x="350" y="36" text-anchor="middle" fill="#4ecca3" font-size="22" font-weight="bold">Git Workflow</text>
<rect x="40" y="65" width="160" height="65" rx="12" fill="#4ecca3"/>
<text x="120" y="93" text-anchor="middle" fill="#1a1a2e" font-size="13" font-weight="bold">Working Dir</text>
<text x="120" y="114" text-anchor="middle" fill="#1a1a2e" font-size="11">edit files</text>
<rect x="270" y="65" width="160" height="65" rx="12" fill="#f9ca24"/>
<text x="350" y="93" text-anchor="middle" fill="#1a1a2e" font-size="13" font-weight="bold">Staging</text>
<text x="350" y="114" text-anchor="middle" fill="#1a1a2e" font-size="11">git add</text>
<rect x="500" y="65" width="160" height="65" rx="12" fill="#ffb347"/>
<text x="580" y="93" text-anchor="middle" fill="#1a1a2e" font-size="13" font-weight="bold">Local Repo</text>
<text x="580" y="114" text-anchor="middle" fill="#1a1a2e" font-size="11">git commit</text>
<rect x="500" y="180" width="160" height="65" rx="12" fill="#e07be0"/>
<text x="580" y="208" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Remote</text>
<text x="580" y="229" text-anchor="middle" fill="#fff" font-size="11">git push</text>
<line x1="200" y1="97" x2="270" y2="97" stroke="#fff" stroke-width="2"/>
<line x1="430" y1="97" x2="500" y2="97" stroke="#fff" stroke-width="2"/>
<line x1="580" y1="130" x2="580" y2="180" stroke="#fff" stroke-width="2"/>
<text x="580" y="168" text-anchor="middle" fill="#f9ca24" font-size="12">pull</text>
</svg>