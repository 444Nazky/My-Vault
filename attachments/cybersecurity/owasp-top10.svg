<svg width="640" height="420" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#333"/><stop offset="1" stop-color="#1a1a2e"/></linearGradient></defs>
<rect width="640" height="420" fill="url(#bg)"/>
